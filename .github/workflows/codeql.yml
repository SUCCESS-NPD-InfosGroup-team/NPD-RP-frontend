# Colocar en .github/workflows/codeql.yml
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"   # lunes 09:00 UTC: revisa también código que no cambia

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # necesario para publicar resultados en la pestaña Security
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none     # JS/TS no necesita compilar para analizarse
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
